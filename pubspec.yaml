name: cancha
description: Project Flutter for pivotea.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.6 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  get: ^4.6.5
  get_storage: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/jpg/
    - assets/images/png/
    - assets/fonts/Comic_Neue/
  
  fonts:
    - family: ComicNeue
      fonts:
        - asset: assets/fonts/Comic_Neue/ComicNeue-Bold.ttf
        - asset: assets/fonts/Comic_Neue/ComicNeue-BoldItalic.ttf
        - asset: assets/fonts/Comic_Neue/ComicNeue-Italic.ttf
        - asset: assets/fonts/Comic_Neue/ComicNeue-Light.ttf
        - asset: assets/fonts/Comic_Neue/ComicNeue-LightItalic.ttf
        - asset: assets/fonts/Comic_Neue/ComicNeue-Regular.ttf
